name: build

# Every push to main and every pull request is checked and packaged; a v* tag also publishes a release and the Docker image.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Check and build
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: web/dist
          retention-days: 7

  windows:
    needs: web
    runs-on: windows-latest
    env:
      # the crypto library needs NASM on Windows; this uses its bundled objects instead
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'bawkbit' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml"
          }

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p bawkbit -p bawkbitd

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: ./packaging/windows/package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          retention-days: 7

  linux:
    needs: web
    runs-on: ubuntu-latest
    # an old base keeps the packages running on distributions back to Ubuntu 22.04 and Debian 12
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates cmake curl file git pkg-config rpm \
            libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p bawkbit -p bawkbitd

      - name: Package
        shell: bash
        run: |
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then label="$GITHUB_REF_NAME"; else label="dev-${GITHUB_SHA::7}"; fi
          sh packaging/linux/package.sh "$label"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          retention-days: 7

  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "bawkbit $GITHUB_REF_NAME" --generate-notes --verify-tag
